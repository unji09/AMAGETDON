services:
  # MySQL
  mysql:
    image: mysql:8.0
    container_name: amagetdon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: amagetdon
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      # DB 데이터 영구 저장
      - mysql-data:/var/lib/mysql

      # CSV 파일 마운트
      - ./data/chapters.csv:/var/lib/mysql-files/chapters.csv
      - ./data/quizzes.csv:/var/lib/mysql-files/quizzes.csv
      - ./data/quiz_choices.csv:/var/lib/mysql-files/quiz_choices.csv
      - ./data/survey_questions.csv:/var/lib/mysql-files/survey_questions.csv

      # 초기화 스크립트 마운트
      - ./init-scripts/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./init-scripts/02-load-data.sql:/docker-entrypoint-initdb.d/02-load-data.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --secure-file-priv=/var/lib/mysql-files

  # Redis
  redis:
    image: redis:7-alpine
    container_name: amagetdon-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data  # 로컬 디렉토리 마운트

volumes:
  mysql-data:
  redis-data: