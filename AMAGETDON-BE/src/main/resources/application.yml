spring:
  application:
    name: amagetdonbe
  profiles:
    include:
      - secret
  datasource:
    url: jdbc:mysql://localhost:3306/amagetdon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  jwt:
    secret-key: "AMAGETDON"
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000

  openvidu:
    url: ${OPENVIDU_URL:http://localhost:4443/}
    secret: ${OPENVIDU_SECRET:need_to_fill_secret}