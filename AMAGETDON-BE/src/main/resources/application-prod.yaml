spring:
  datasource:
    url: jdbc:mysql://mysql:3306/amagetdon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: redis
      port: 6379

  jwt:
    secret-key: ${JWT_SECRET}

  cookie:
    secure: true
    same-site: Lax

  mail:
    username: ${MAIL_USERNAME}
    password: ${MY_EMAIL_PASSWORD}

kakao:
  rest-api-key: ${REST_KAKAO_API_KEY}
  redirect-uri: ${REDIRECT_URL}

openvidu:
  url: ${OPENVIDU_URL:http://openvidu:4443/}
  secret: ${OPENVIDU_SECRET}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: amagetdon-be

fastapi:
  url: http://fastapi:8000
