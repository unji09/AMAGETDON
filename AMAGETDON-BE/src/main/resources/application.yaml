spring:
  profiles:
    include:
      - db
      - secret
  application:
    name: amagetdonbe
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:amagetdon}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jwt:
    secret-key: "ArmageddonTemporarySecretKeyForTesting"
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000

  cookie:
    secure: false
    same-site: Lax

  mail:
    host: smtp.gmail.com
    port: 587
    username: service.tester.20260130@gmail.com
    password: MY_EMAIL_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

openvidu:
  url: ${OPENVIDU_URL:https://openvidu:4443/}
  secret: ${OPENVIDU_SECRET:MY_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

fastapi:
  url: ${FASTAPI_URL:http://fastapi:8000}
  quiz:
    generate-endpoint: /api/quiz/generate
  personality:
    analyze-endpoint: /api/personality/analyze

server:
  servlet:
    context-path: /api/v1