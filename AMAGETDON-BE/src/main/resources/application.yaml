spring:
  profiles:
    include:
      - db
      - secret
  application:
    name: amagetdonbe
  datasource:
    url: jdbc:mysql://localhost:3306/amagetdon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  jwt:
    secret: AmagetdonSecretKeyForJWTGeneration
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

server:
  servlet:
    context-path: /api/v1