version: '3.8'

services:
  collector:
    build: .
    container_name: stock-collector
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: amagetdon
      
      API_KEY: ${API_KEY}
      API_SECRET: ${API_SECRET}
      
      TZ: Asia/Seoul
    
    restart: unless-stopped
    
    extra_hosts:
      - "host.docker.internal:host-gateway"