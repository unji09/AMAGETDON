services:
  mysql:
    ports: !override
      - "127.0.0.1:3306:3306"
    restart: unless-stopped

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  openvidu:
    image: openvidu/openvidu-server:2.32.0
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    ports: !reset null
    environment: !override
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - DOMAIN_OR_PUBLIC_IP=${DOMAIN}
      - HTTPS_PORT=443
      - SERVER_SSL_ENABLED=false
      - SERVER_PORT=5443
      - KMS_URIS=["ws://kms:8888/kurento"]
      - COTURN_IP=${COTURN_IP:-${DOMAIN}}
      - COTURN_PORT=3478
      - OPENVIDU_RECORDING=false
    volumes: !override
      - ./openvidu/coturn:/run/secrets/coturn
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - kms

  kms:
    image: kurento/kurento-media-server:7.3.0
    container_name: amagetdon-kms
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - amagetdon-network

  backend:
    ports: !reset null
    environment: !override
      - SPRING_PROFILES_ACTIVE=prod
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-validate}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MY_EMAIL_PASSWORD=${MY_EMAIL_PASSWORD}
      - REST_KAKAO_API_KEY=${REST_KAKAO_API_KEY}
      - OPENVIDU_URL=http://openvidu:5443/
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - REDIRECT_URL=${REDIRECT_URL}
      - TZ=Asia/Seoul

  fastapi:
    ports: !reset null
    volumes: !override
      - ./backup:/app/backup

  collector:
    network_mode: host
    networks: !reset null
    extra_hosts: !reset null
    environment:
      - DB_HOST=localhost
      - REDIS_HOST=localhost
      - KIS_HTS_ID=${KIS_HTS_ID}

  frontend:
    build:
      args:
        - VITE_KAKAO_JS_KEY=${VITE_KAKAO_JS_KEY}
