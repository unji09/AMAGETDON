
services:
  # MySQL
  mysql:
    image: mysql:8.0
    container_name: amagetdon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: amagetdon
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./AMAGETDON-BE/data/chapters.csv:/var/lib/mysql-files/chapters.csv
      - ./AMAGETDON-BE/data/quizzes.csv:/var/lib/mysql-files/quizzes.csv
      - ./AMAGETDON-BE/data/quiz_choices.csv:/var/lib/mysql-files/quiz_choices.csv
      - ./AMAGETDON-BE/data/survey_questions.csv:/var/lib/mysql-files/survey_questions.csv
      - ./AMAGETDON-BE/data/achievements.csv:/var/lib/mysql-files/achievements.csv
      - ./AMAGETDON-BE/init-scripts/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./AMAGETDON-BE/init-scripts/02-load-data.sql:/docker-entrypoint-initdb.d/02-load-data.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --secure-file-priv=/var/lib/mysql-files
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amagetdon-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: amagetdon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amagetdon-network

  # FastAPI Quiz Service
  fastapi:
    build:
      context: ./AMAGETDON-FastAPI
      dockerfile: Dockerfile
    container_name: amagetdon-fastapi
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=amagetdon
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - amagetdon-network
    volumes:
      - ./AMAGETDON-FastAPI:/app
      - ./backup:/app/backup

  # HDFS NameNode (MySQL 에서 삭제되는 시세/캔들 데이터의 보관소)
  namenode:
    image: apache/hadoop:3.4.1
    container_name: amagetdon-namenode
    hostname: namenode
    user: root
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -d /opt/hadoop/data/nameNode/current ]; then
          hdfs namenode -format -force -nonInteractive
        fi
        exec hdfs namenode
    environment:
      - HDFS_NAMENODE_USER=root
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.replication=1
      - HDFS-SITE.XML_dfs.namenode.name.dir=/opt/hadoop/data/nameNode
      - HDFS-SITE.XML_dfs.namenode.rpc-bind-host=0.0.0.0
      - HDFS-SITE.XML_dfs.namenode.http-bind-host=0.0.0.0
      - HDFS-SITE.XML_dfs.webhdfs.enabled=true
      - HDFS-SITE.XML_dfs.permissions.enabled=false
      - TZ=Asia/Seoul
    ports:
      - "9870:9870"
    volumes:
      - hdfs-namenode:/opt/hadoop/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9870"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - amagetdon-network

  # HDFS DataNode
  datanode:
    image: apache/hadoop:3.4.1
    container_name: amagetdon-datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    environment:
      - HDFS_DATANODE_USER=root
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.replication=1
      - HDFS-SITE.XML_dfs.datanode.data.dir=/opt/hadoop/data/dataNode
      - HDFS-SITE.XML_dfs.webhdfs.enabled=true
      - HDFS-SITE.XML_dfs.permissions.enabled=false
      - TZ=Asia/Seoul
    volumes:
      - hdfs-datanode:/opt/hadoop/data
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - amagetdon-network

  # Stock Collector Service
  # bridge 네트워크 + extra_hosts로 외부 API 접속 및 내부 서비스 접근
  collector:
    profiles:
      - collect
    build:
      context: ./AMAGETDON-Collector
      dockerfile: Dockerfile
    container_name: amagetdon-collector
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=amagetdon
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STOCK_API_KEY=${STOCK_API_KEY}
      - STOCK_API_SECRET=${STOCK_API_SECRET}
      - CANDLE_API_KEY=${CANDLE_API_KEY}
      - CANDLE_API_SECRET=${CANDLE_API_SECRET}
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - amagetdon-network

volumes:
  mysql-data:
  redis-data:
  hdfs-namenode:
  hdfs-datanode:

networks:
  amagetdon-network:
    driver: bridge
