version: '3.8'

services:
  fastapi:
    build: .
    container_name: amagetdon-fastapi
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=host.docker.internal  # 다른 컨테이너의 MySQL 접근
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=amagetdon
      - GMS_API_KEY=${GMS_API_KEY}
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload